services:
  yf-erp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: harwav-yf-erp-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LLM_BASE_URL=https://api.minimax.chat/v1/text/chatcompletion_v2
      - LLM_MODEL=MiniMax-M3
    networks:
      - hermes-nas_default

networks:
  hermes-nas_default:
    external: true
